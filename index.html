<style>
:root {
  --bg: #eef1f9; --surface: #ffffff; --ink: #141b45; --muted: #4b5382;
  --line: #cbd2ea; --accent: #f5b301; --on-accent: #141b45; --focus: #2f4bd8;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1330; --surface: #171e45; --ink: #eef1ff; --muted: #a9b2dc;
    --line: #2e376b; --accent: #ffc53d; --focus: #8fa2ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1330; --surface: #171e45; --ink: #eef1ff; --muted: #a9b2dc;
  --line: #2e376b; --accent: #ffc53d; --focus: #8fa2ff; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { min-height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1.0625rem/1.6 var(--body); -webkit-font-smoothing: antialiased; }
.page { width: min(100% - 2.5rem, 44rem); margin-inline: auto; padding-block: clamp(2rem, 8vw, 5rem); }
.brand { display: flex; align-items: center; gap: .75rem; color: inherit; text-decoration: none; }
.brand svg { width: 3.25rem; height: auto; flex: none; color: var(--ink); }
.brand span { font: 800 1.125rem/1 var(--display); letter-spacing: -.01em; }
h1 { margin: 0; font: 800 clamp(2.25rem, 8vw, 4rem)/1.02 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.lede { margin: 1.125rem 0 0; max-width: 34rem; color: var(--muted); font-size: 1.125rem; }
h2 { margin: clamp(2.5rem, 8vw, 3.5rem) 0 1rem; font: 500 1rem/1.3 var(--display); color: var(--muted); }
.home > header, .exam > .spot { margin-top: clamp(2.5rem, 10vw, 5rem); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .875rem; }
.doc { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem 1.125rem;
  padding: 1.125rem 1.25rem; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 1.25rem; color: inherit; text-decoration: none; transition: border-color .2s ease, transform .2s ease; }
.bubble { display: grid; place-items: center; width: 3rem; height: 3rem; border: 2px solid var(--ink);
  border-radius: 50%; color: var(--ink); transition: background-color .18s ease; }
.bubble svg { width: 1.25rem; height: 1.25rem; }
.doc h3 { margin: 0; font: 800 1.1875rem/1.25 var(--display); letter-spacing: -.01em; }
.doc p { margin: .25rem 0 0; color: var(--muted); font-size: .9688rem; line-height: 1.45; }
.open { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; font-size: .9375rem;
  white-space: nowrap; padding: .5rem .875rem; border-radius: 999px; border: 1.5px solid var(--line);
  transition: background-color .18s ease, border-color .18s ease; }
.open svg { width: .95rem; height: .95rem; }
.doc:hover, .doc:focus-visible { border-color: var(--ink); }
.doc:hover .bubble, .doc:focus-visible .bubble { background: var(--accent); }
.doc:hover .open, .doc:focus-visible .open { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.doc:active { transform: translateY(1px); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.deadline { display: grid; align-content: center; justify-items: center; min-width: 5.5rem; padding: .5rem .625rem;
  border: 2px solid currentColor; border-radius: .875rem; text-align: center; line-height: 1.15; transition: background-color .18s ease, color .18s ease; }
.deadline small { font-size: .75rem; font-weight: 500; opacity: .8; }
.deadline strong { font: 800 1.0625rem/1.15 var(--display); letter-spacing: -.01em; }
.job:hover .deadline, .job:focus-visible .deadline { background: var(--accent); color: var(--on-accent); border-color: var(--on-accent); }
.jobs:empty::before { content: "No notifications yet. New job notifications will appear here.";
  display: block; padding: 1.5rem 1.25rem; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 1.25rem; }
.exam { display: none; }
.exam.open { display: block; animation: arrive .25s ease-out; }
.home.hidden { display: none; }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.back { display: inline-flex; align-items: center; gap: .5rem; margin-top: clamp(2rem, 6vw, 3rem); padding: .5rem 1rem .5rem .75rem;
  border: 1.5px solid var(--line); border-radius: 999px; color: inherit; text-decoration: none; font-weight: 600; font-size: .9375rem; transition: background-color .18s ease, border-color .18s ease; }
.back svg { width: 1rem; height: 1rem; }
.back:hover { background: var(--surface); border-color: var(--ink); }
.spot { display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem 1.5rem; padding: clamp(1.25rem, 5vw, 2rem);
  background: var(--accent); color: var(--on-accent); border-radius: 1.5rem; }
.spot h1 { font-size: clamp(1.75rem, 6vw, 2.75rem); }
.spot p { margin: .5rem 0 0; font-size: 1.0625rem; }
.spot .deadline { min-width: 6.5rem; padding: .75rem; }
.spot .deadline strong { font-size: 1.25rem; }
.spot .open { margin-top: 1rem; border-color: var(--on-accent); color: var(--on-accent); text-decoration: none; }
.spot .open:hover { background: var(--on-accent); color: var(--accent); }
footer { margin-top: 3rem; color: var(--muted); font-size: .9375rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 34rem) { .doc { grid-template-columns: auto 1fr; padding: 1rem; } .doc .open { grid-column: 2; justify-self: start; } }

/* ---- Admin ---- */
.btn { font: 600 .9375rem var(--body); padding: .55rem 1rem; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--on-accent); }
.btn.pri:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.bad { border-color: #c0392b; color: #c0392b; }
.btn.bad:hover { background: #c0392b; color: #fff; }
.admin-fab { position: fixed; right: 1rem; top: calc(1rem + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--accent); color: var(--on-accent); border-color: var(--on-accent); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.ov { position: fixed; inset: 0; z-index: 10; background: rgba(8,12,40,.65); overflow-y: auto; padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); }
.panel { width: min(100%, 40rem); margin: 0 auto; background: var(--bg); border: 1.5px solid var(--line); border-radius: 1.5rem; padding: 1.25rem; }
.panel h2 { margin: 0 0 .25rem; font: 800 1.5rem/1.2 var(--display); color: var(--ink); }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.item { display: flex; gap: .75rem; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: .875rem 1rem; background: var(--surface); border: 1.5px solid var(--line); border-radius: 1rem; }
.item b { font-family: var(--display); }
.item small { display: block; color: var(--muted); }
.panel label { display: block; margin-top: .875rem; font-weight: 600; font-size: .9375rem; }
.panel input, .panel textarea { width: 100%; margin-top: .3rem; padding: .65rem .8rem; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: .75rem; }
.panel textarea { min-height: 7rem; resize: vertical; }
.hint { color: var(--muted); font-size: .875rem; margin: .25rem 0 0; }
.msg { margin: .75rem 0 0; font-weight: 600; min-height: 1.4em; }
.msg.err { color: #c0392b; }
</style>

<main class="page">
  <a class="brand" href="#" aria-label="Hamsika Infinity, home">
    <svg viewBox="0 0 52 28" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <circle cx="14" cy="14" r="11.5" fill="var(--accent)"></circle><circle cx="38" cy="14" r="11.5"></circle>

<script type="application/json" id="data">{"jobs":[{"id":"ssc-cgl-2026","title":"SSC CGL 2026","note":"Staff Selection Commission, Combined Graduate Level.","last":"See notice","notice":"https://drive.google.com/file/d/1V6Rge0zSKwODtAOS7J1puGdX_eFvhD8D/view?usp=drive_link","docs":[{"title":"Complete Syllabus Study Guide","desc":"Every subject and topic covered in the SSC CGL syllabus.","url":"https://docs.google.com/document/d/1JYo3__9S_7UNPYX2v7sQQfcInDce-HAz/edit"},{"title":"Roadmap","desc":"A study plan to take you from first day to exam day.","url":"https://docs.google.com/document/d/1nN7CqZWtvXxWAOzFs-lv4-AQ1ED7SSXi/edit"}]}]}</script>
<script>
(function () {
  document.documentElement.classList.add('js');
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var HASH = '48d9716f414bb9236848fdf50b9f06e3464fb1a1029311b1335b176ae03bb6b8';
  var P = {
    arrow: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
    ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    back: '<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/><path d="M9 8h7"/>'
  };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function ic(p) { var w = el('span'); w.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; return w.firstChild; }
  function okUrl(u) { return /^https?:\/\//i.test(u); }
  function deadline(j) { var d = el('span', 'deadline'); d.appendChild(el('small', null, 'Last date')); d.appendChild(el('strong', null, j.last || 'See notice')); return d; }
  function titled(h, p) { var s = el('span'); s.appendChild(el('h3', null, h)); s.appendChild(el('p', null, p)); return s; }

  /* ---------- Public rendering ---------- */
  var home = document.querySelector('.home'), jobsUl = document.getElementById('jobs'), pagesEl = document.getElementById('pages');

  function render() {
    jobsUl.replaceChildren(); pagesEl.replaceChildren();
    DATA.jobs.forEach(function (j) {
      var li = el('li'), a = el('a', 'doc job'); a.href = '#' + j.id;
      a.appendChild(deadline(j)); a.appendChild(titled(j.title, j.note));
      var o = el('span', 'open', 'Study material '); o.appendChild(ic(P.arrow)); a.appendChild(o);
      li.appendChild(a); jobsUl.appendChild(li);

      var s = el('section', 'exam'); s.id = j.id; s.setAttribute('aria-labelledby', 't-' + j.id);
      var b = el('a', 'back'); b.href = '#'; b.appendChild(ic(P.back)); b.appendChild(document.createTextNode('All notifications')); s.appendChild(b);
      var sp = el('div', 'spot'); sp.appendChild(deadline(j));
      var d = el('div'), h = el('h1', null, j.title); h.id = 't-' + j.id; d.appendChild(h); d.appendChild(el('p', null, j.note));
      if (okUrl(j.notice || '')) { var n = el('a', 'open', 'Read official notice'); n.href = j.notice; n.target = '_blank'; n.rel = 'noopener noreferrer'; d.appendChild(n); }
      sp.appendChild(d); s.appendChild(sp);
      s.appendChild(el('h2', null, 'Study material for this notification'));
      var ul = el('ul');
      (j.docs || []).forEach(function (x) {
        var l = el('li'), k = el('a', 'doc'); k.href = x.url; k.target = '_blank'; k.rel = 'noopener noreferrer';
        var bu = el('span', 'bubble'); bu.setAttribute('aria-hidden', 'true'); bu.appendChild(ic(P.book));
        k.appendChild(bu); k.appendChild(titled(x.title, x.desc || ''));
        var op = el('span', 'open', 'Open '); op.appendChild(ic(P.ext)); op.appendChild(el('span', 'sr', x.title + ' (opens in a new tab)'));
        k.appendChild(op); l.appendChild(k); ul.appendChild(l);
      });
      s.appendChild(ul); pagesEl.appendChild(s);
    });
  }
  function route(id) {
    var found = null;
    [].forEach.call(document.querySelectorAll('.exam'), function (p) { var on = p.id === id; p.classList.toggle('open', on); if (on) found = p; });
    home.classList.toggle('hidden', !!found);
    window.scrollTo(0, 0);
    var h = (found || home).querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  function fromHash() { route(decodeURIComponent(location.hash.slice(1))); }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    var id = a.getAttribute('href').slice(1);
    route(id);
    try { if (location.hash.slice(1) !== id) history.pushState(null, '', id ? '#' + id : location.pathname + location.search); } catch (err) {}
  });
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('popstate', fromHash);
  render(); fromHash();
  fetch('jobs.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.jobs) { DATA = d; render(); fromHash(); } }).catch(function () {});

  /* ---------- Admin ---------- */
  var adm = document.getElementById('adm'); 
  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  async function sha(s) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [].map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  function field(form, label, name, val, big, hint) {
    var l = el('label', null, label), i = el(big ? 'textarea' : 'input'); i.name = name; i.value = val || '';
    if (!big) i.type = 'text'; l.appendChild(i); if (hint) l.appendChild(el('p', 'hint', hint)); form.appendChild(l); return i;
  }
  function shell(title) {
    adm.replaceChildren();
    var ov = el('div', 'ov'), p = el('div', 'panel'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Admin');
    var r = el('div', 'row'); r.appendChild(el('h2', null, title));
    var x = el('button', 'btn', 'Close'); x.type = 'button'; x.onclick = function () { adm.replaceChildren(); }; r.appendChild(x);
    p.appendChild(r); ov.appendChild(p); adm.appendChild(ov); return p;
  }
  function loginView() {
    var p = shell('Admin login'), f = el('form');
    var u = field(f, 'Username', 'u'), w = field(f, 'Password', 'p'); w.type = 'password'; u.autocomplete = 'username'; w.autocomplete = 'current-password';
    var rp = field(f, 'GitHub repository', 'r', store('repo') || '', false, 'Format: owner/repo, e.g. hamsika/hamsika-infinity'),
        br = field(f, 'Branch', 'b', store('branch') || 'main'),
        tk = field(f, 'GitHub token', 't', store('token') || '', false, 'Fine-grained token with Contents: Read and write on this one repository. Kept only in this browser tab until you log out.');
    tk.type = 'password'; tk.autocomplete = 'off';
    var m = el('p', 'msg err'), go = el('button', 'btn pri', 'Log in'); go.type = 'submit'; go.style.marginTop = '1rem';
    f.appendChild(m); f.appendChild(go); p.appendChild(f);
    f.onsubmit = async function (e) {
      e.preventDefault();
      if (await sha(u.value.trim() + ':' + w.value) !== HASH) { m.textContent = 'Wrong username or password.'; return; }
      if (!/^[\w.-]+\/[\w.-]+$/.test(rp.value.trim())) { m.textContent = 'Repository must look like owner/repo.'; return; }
      if (!tk.value.trim()) { m.textContent = 'Please paste your GitHub token.'; return; }
      store('adm', '1'); store('repo', rp.value.trim()); store('branch', br.value.trim() || 'main'); store('token', tk.value.trim()); listView();
    };
    u.focus();
  }
  function listView(note) {
    var p = shell('Manage postings'), r = el('div', 'row');
    var add = el('button', 'btn pri', '+ Add posting'); add.type = 'button'; add.onclick = function () { formView(null); };
    var out = el('button', 'btn', 'Log out'); out.type = 'button'; out.onclick = function () { store('adm', null); store('token', null); adm.replaceChildren(); };
    r.appendChild(add); r.appendChild(out); r.style.margin = '1rem 0'; p.appendChild(r);
    var m = el('p', 'msg', note || ''); p.appendChild(m);
    var ul = el('ul');
    if (!DATA.jobs.length) ul.appendChild(el('li', 'hint', 'No postings yet. Click "Add posting".'));
    DATA.jobs.forEach(function (j) {
      var li = el('li', 'item'), t = el('span'), b = el('b', null, j.title), s = el('small', null, 'Last date: ' + (j.last || '-') + ' · ' + (j.docs || []).length + ' study link(s)');
      t.appendChild(b); t.appendChild(s); li.appendChild(t);
      var ac = el('span', 'row'), ed = el('button', 'btn', 'Edit'), de = el('button', 'btn bad', 'Delete'); ed.type = de.type = 'button';
      ed.onclick = function () { formView(j); };
      de.onclick = function () {
        if (de.dataset.sure) { DATA.jobs = DATA.jobs.filter(function (x) { return x !== j; }); commit(m); }
        else { de.dataset.sure = 1; de.textContent = 'Confirm delete?'; }
      };
      ac.appendChild(ed); ac.appendChild(de); li.appendChild(ac); ul.appendChild(li);
    });
    p.appendChild(ul);
  }
  function formView(j) {
    var p = shell(j ? 'Edit posting' : 'Add posting'), f = el('form');
    var t = field(f, 'Job title', 't', j && j.title), n = field(f, 'Organisation / short note', 'n', j && j.note),
        d = field(f, 'Last date', 'd', j && j.last, false, 'Any text, e.g. 30 Nov 2026. Leave empty to show "See notice".'),
        o = field(f, 'Official notice link (optional)', 'o', j && j.notice, false, 'Starts with https://'),
        s = field(f, 'Study material links (one per line)', 's', j ? (j.docs || []).map(function (x) { return [x.title, x.desc, x.url].join(' | '); }).join('\n') : '', true, 'Format: Title | Description | https://link (or just paste the link)');
    var m = el('p', 'msg err'), row = el('div', 'row'), save = el('button', 'btn pri', 'Save and publish'), cx = el('button', 'btn', 'Cancel');
    save.type = 'submit'; cx.type = 'button'; cx.onclick = function () { listView(); };
    row.appendChild(save); row.appendChild(cx); row.style.marginTop = '1rem'; f.appendChild(m); f.appendChild(row); p.appendChild(f);
    f.onsubmit = function (e) {
      e.preventDefault();
      if (!t.value.trim()) { m.textContent = 'Please enter a job title.'; return; }
      if (o.value.trim() && !okUrl(o.value.trim())) { m.textContent = 'Official notice link must start with http:// or https://'; return; }
      var docs = [];
      for (var i = 0, ls = s.value.split('\n'); i < ls.length; i++) {
        if (!ls[i].trim()) continue;
        var q = ls[i].split('|').map(function (z) { return z.trim(); });
        var url = q.length >= 3 ? q[q.length - 1] : q.length === 2 ? q[1] : okUrl(q[0]) ? q[0] : '';
        if (q.length === 1 && okUrl(q[0])) q[0] = '';
        if (!okUrl(url)) { m.textContent = 'Line ' + (i + 1) + ': each study link needs a title and an https:// URL.'; return; }
        docs.push({ title: q[0] || 'Study material ' + (docs.length + 1), desc: q.length >= 3 ? q.slice(1, -1).join(' | ') : '', url: url });
      }
      var rec = { id: j ? j.id : (t.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'job') + '-' + Date.now().toString(36),
        title: t.value.trim(), note: n.value.trim(), last: d.value.trim(), notice: o.value.trim(), docs: docs };
      if (j) DATA.jobs[DATA.jobs.indexOf(j)] = rec; else DATA.jobs.unshift(rec);
      m.className = 'msg'; commit(m);
    };
    t.focus();
  }
  async function commit(m) {
    render(); m.className = 'msg'; m.textContent = 'Saving to GitHub…';
    var repo = store('repo'), br = store('branch') || 'main', tok = store('token');
    if (!repo || !tok) { m.className = 'msg err'; m.textContent = 'Log out and log in again with your GitHub details.'; return; }
    var url = 'https://api.github.com/repos/' + repo + '/contents/jobs.json';
    var hd = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    try {
      var g = await fetch(url + '?ref=' + encodeURIComponent(br) + '&t=' + Date.now(), { headers: hd, cache: 'no-store' });
      var sha1 = null;
      if (g.ok) sha1 = (await g.json()).sha;
      else if (g.status !== 404) throw new Error(g.status === 401 || g.status === 403 ? 'GitHub rejected the token (check it and its Contents permission).' : 'GitHub error ' + g.status);
      var body = { message: 'Update job postings from admin panel', branch: br,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2) + '\n'))) };
      if (sha1) body.sha = sha1;
      var r = await fetch(url, { method: 'PUT', headers: hd, body: JSON.stringify(body) });
      if (!r.ok) throw new Error(r.status === 404 ? 'Repository or branch not found, or the token has no access to it.' : r.status === 409 || r.status === 422 ? 'Conflict while saving. Try again.' : 'GitHub error ' + r.status);
      m.className = 'msg'; m.textContent = 'Saved to GitHub. The live site updates in about a minute.';
    } catch (e) { m.className = 'msg err'; m.textContent = 'Not saved: ' + e.message; }
  }
  var open = function () { store('adm') ? listView() : loginView(); };
  var fab = el('button', 'btn admin-fab', 'Admin login'); fab.type = 'button'; fab.onclick = open; document.body.appendChild(fab);
  if (store('adm')) listView();
})();
</script>
